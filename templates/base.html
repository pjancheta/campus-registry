<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusDesk · Student Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">C</span>
      <div><strong>CampusDesk</strong><small>Student Registry</small></div>
    </div>
    <nav>
      <a href="{{ url_for('students_list') }}" class="{{ 'active' if request.endpoint == 'students_list' }}">All Students</a>
      <a href="{{ url_for('student_new') }}" class="{{ 'active' if request.endpoint == 'student_new' }}">Enroll Student</a>
    </nav>
    <p class="side-note">Records are saved in a PostgreSQL database.</p>
  </aside>

  <div class="content">
    <main>
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="toast {{ category }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
